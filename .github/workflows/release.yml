name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            binary: fcg-linux-amd64
          - os: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
            binary: fcg-linux-arm64
          - os: macos-latest
            goos: darwin
            goarch: arm64
            binary: fcg-darwin-arm64
          - os: macos-13
            goos: darwin
            goarch: amd64
            binary: fcg-darwin-amd64
          - os: windows-latest
            goos: windows
            goarch: amd64
            binary: fcg-windows-amd64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Install MinGW (Windows)
        if: matrix.goos == 'windows'
        run: choco install mingw -y
      - name: Test
        run: go test ./... -count=1
        env:
          CGO_ENABLED: 1
      - name: Build
        run: go build -ldflags "-X github.com/kirovcaptain/FlashCodeGraph/internal/gateway/cli.version=${{ github.ref_name }}" -o ${{ matrix.binary }} ./cmd/fcg/
        env:
          CGO_ENABLED: 1
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.binary }}
          path: ${{ matrix.binary }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
